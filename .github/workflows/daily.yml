name: Daily Stock Bot

on:
  schedule:
    - cron: '20 2 * * 1-5'   # Mon–Fri 13:15 Taiwan time
    #- cron: '15 5 * * 1-5'   # Mon–Fri 17:15 Taiwan time

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          US_STOCKS: ${{ vars.US_STOCKS }}
          TW_STOCKS: ${{ vars.TW_STOCKS }}
          INDICES: ${{ vars.INDICES }}
          FX_PAIRS: ${{ vars.FX_PAIRS }}
        run: python stock_bot.py
